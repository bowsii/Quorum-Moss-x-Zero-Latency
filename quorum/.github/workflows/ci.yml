name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: quorum/requirements.txt

      - name: Install dependencies
        run: |
          cd quorum
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint with ruff
        run: |
          cd quorum
          ruff check . --select E,F,W --ignore E501

      - name: Run unit tests
        run: |
          cd quorum
          python -m pytest tests/ -v --tb=short

      - name: Assert collision-window integrity
        run: |
          cd quorum
          python benchmark/metrics/collision_window_integrity.py
        # Per implementation.md §10.1 — must run on every PR

  benchmark-smoke:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd quorum
          pip install -r requirements.txt

      - name: Smoke-run relay arm baseline
        run: |
          cd quorum
          python -c "import asyncio; from benchmark.relay_arm import RelayArm; arm = RelayArm(); result = asyncio.run(arm.run('test question')); print('Relay arm smoke test:', result)"
